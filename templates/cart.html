<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shopping Bag | ShopKart</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        .cart-page {
            max-width: 1200px;
            margin: 50px auto;
            padding: 0 24px 60px;
            color: #24382f;
        }

        .cart-heading {
            margin-bottom: 30px;
        }

        .cart-heading h1 {
            font-size: 36px;
            margin-bottom: 8px;
        }

        .cart-heading p {
            color: #777;
        }

        .cart-layout {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 30px;
            align-items: start;
        }

        .cart-items,
        .order-summary {
            background: #fff;
            border: 1px solid #e8e8e3;
            border-radius: 14px;
            padding: 24px;
        }

        .cart-item {
            display: grid;
            grid-template-columns: 110px 1fr auto;
            gap: 20px;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid #eee;
        }

        .cart-item:first-child {
            padding-top: 0;
        }

        .cart-item:last-child {
            border-bottom: none;
        }

        .cart-item img {
            width: 110px;
            height: 110px;
            object-fit: cover;
            border-radius: 10px;
            background: #f5f5f0;
        }

        .cart-item h3 {
            font-size: 17px;
            margin: 0 0 8px;
        }

        .cart-item-price {
            font-weight: 600;
            margin-bottom: 12px;
        }

        .quantity-control {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            border: 1px solid #ddd;
            border-radius: 7px;
            padding: 5px 10px;
        }

        .quantity-control button {
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 18px;
            color: #24382f;
            padding: 2px 5px;
        }

        .quantity-control span {
            min-width: 18px;
            text-align: center;
        }

        .cart-item-right {
            text-align: right;
        }

        .item-total {
            font-weight: 700;
            margin-bottom: 15px;
        }

        .remove-button {
            background: none;
            border: none;
            color: #b34343;
            cursor: pointer;
            text-decoration: underline;
        }

        .order-summary h2 {
            font-size: 22px;
            margin: 0 0 22px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin: 16px 0;
            color: #666;
        }

        .summary-total {
            border-top: 1px solid #e5e5e0;
            padding-top: 18px;
            margin-top: 20px;
            color: #24382f;
            font-weight: 700;
            font-size: 19px;
        }

        .checkout-button,
        .continue-button {
            display: block;
            width: 100%;
            box-sizing: border-box;
            text-align: center;
            padding: 14px 18px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
        }

        .checkout-button {
            background: #234d3a;
            color: #fff;
            border: none;
            margin-top: 24px;
        }

        .checkout-button:hover {
            background: #193b2b;
        }

        .continue-button {
            background: #fff;
            color: #234d3a;
            border: 1px solid #234d3a;
            margin-top: 12px;
        }

        .empty-cart {
            text-align: center;
            padding: 50px 20px;
        }

        .empty-cart .empty-icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        .empty-cart h2 {
            margin-bottom: 10px;
        }

        .empty-cart p {
            color: #777;
            margin-bottom: 25px;
        }

        .empty-cart .continue-button {
            max-width: 230px;
            margin: 0 auto;
            background: #234d3a;
            color: white;
        }

        .delivery-note {
            background: #f5f7f2;
            color: #45634f;
            border-radius: 8px;
            padding: 12px;
            font-size: 13px;
            line-height: 1.5;
            margin-top: 20px;
        }

        @media (max-width: 800px) {
            .cart-layout {
                grid-template-columns: 1fr;
            }

            .cart-heading h1 {
                font-size: 29px;
            }
        }

        @media (max-width: 480px) {
            .cart-page {
                margin-top: 30px;
                padding-left: 14px;
                padding-right: 14px;
            }

            .cart-items,
            .order-summary {
                padding: 16px;
            }

            .cart-item {
                grid-template-columns: 80px 1fr;
                gap: 12px;
            }

            .cart-item img {
                width: 80px;
                height: 90px;
            }

            .cart-item-right {
                grid-column: 2;
                display: flex;
                align-items: center;
                justify-content: space-between;
                text-align: left;
            }

            .item-total {
                margin-bottom: 0;
            }
        }
    </style>
</head>

<body>

    <main class="cart-page">

        <div class="cart-heading">
            <h1>My Shopping Bag</h1>
            <p>Review your items before placing your order.</p>
        </div>

        <div class="cart-layout">

            <section class="cart-items" id="cartItems">
                <p>Loading your shopping bag...</p>
            </section>

            <aside class="order-summary" id="orderSummary">
                <h2>Order Summary</h2>

                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="subtotal">₹0</span>
                </div>

                <div class="summary-row">
                    <span>Delivery</span>
                    <span id="delivery">₹0</span>
                </div>

                <div class="summary-row summary-total">
                    <span>Total</span>
                    <span id="total">₹0</span>
                </div>

                <button class="checkout-button" id="checkoutButton">
                    Proceed to Checkout
                </button>

                <a href="/" class="continue-button">
                    Continue Shopping
                </a>

                <div class="delivery-note">
                    Your order summary updates automatically when you change
                    product quantities.
                </div>
            </aside>

        </div>

    </main>

    <script src="{{ url_for('static', filename='js/cart.js') }}"></script>

</body>
</html>
